# Fast feedback on every push and pull request. The full pipeline (SonarQube,
# deploy to Minikube, API tests) runs in Jenkins - see readaloud-devops.
name: CI

on:
  push:
    branches: [master, app-fresh]
  pull_request:

permissions:
  contents: read

env:
  HADOLINT_VERSION: v2.15.1
  GITLEAKS_VERSION: 8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  FLUTTER_VERSION: 3.44.9

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        run: |
          curl -sSfL -o hadolint "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x hadolint
          ./hadolint backend/Dockerfile mobile/Dockerfile

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 .
      - name: Test
        run: pytest --cov=app --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  images:
    needs: [backend, web, dockerfile-lint, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: readaloud-backend
            context: backend
          - name: readaloud-web
            context: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "${{ matrix.name }}:${{ github.sha }}" ${{ matrix.context }}
      - name: Trivy scan (fail on HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "${{ matrix.name }}:${{ github.sha }}"
      - name: Push to GHCR (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${{ matrix.name }}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${{ github.sha }}" latest; do
            docker tag "${{ matrix.name }}:${{ github.sha }}" "$image:$tag"
            docker push "$image:$tag"
          done
