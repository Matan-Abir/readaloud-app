# Serves the Flutter web build and forwards /api to the backend, so the
# browser talks to one origin (no CORS, no hard-coded backend address).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Large uploads go straight through to the backend, which enforces its own limit.
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html and the service worker must never be cached, or a new build
    # will not show up until the browser cache expires.
    location ~* (index\.html|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache";
    }
}
