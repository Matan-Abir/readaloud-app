# Local run of the whole app in containers: Postgres + backend (with the Piper
# voice inside) + web app (nginx). Open http://localhost:8080
services:
  db:
    image: postgres:15.19-alpine
    environment:
      POSTGRES_USER: readaloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readaloud}
      POSTGRES_DB: readaloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readaloud"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    image: readaloud-backend:local
    environment:
      DATABASE_URL: postgresql://readaloud:${POSTGRES_PASSWORD:-readaloud}@db:5432/readaloud
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-to-32-bytes-or-more}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    command: >-
      sh -c "flask db upgrade && exec gunicorn --bind 0.0.0.0:8000 --workers 2
      --timeout 120 --access-logfile - wsgi:app"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      retries: 20
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./mobile
    image: readaloud-web:local
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
